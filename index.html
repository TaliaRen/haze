<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Haze makes soft, flowing gradients. Pick a mood, shape the colors, and download an image or a seamless video loop.">
<meta name="theme-color" content="#f3f1ec">
<meta property="og:title" content="Haze">
<meta property="og:description" content="Soft, flowing gradients. Still or in motion.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://taliaren.github.io/haze/">
<meta property="og:image" content="https://taliaren.github.io/haze/docs/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Haze">
<meta name="twitter:description" content="Soft, flowing gradients. Still or in motion.">
<meta name="twitter:image" content="https://taliaren.github.io/haze/docs/og.png">
<title>Haze</title>
<link rel="icon" href="data:image/svg+xml,<svg width='26' height='26' viewBox='0 0 26 26' xmlns='http://www.w3.org/2000/svg'><rect width='26' height='26' rx='7.5' fill='%2317171a'/><g fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'><path d='M6.5 9.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0'/><path d='M6.5 13.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0' opacity='.68'/><path d='M6.5 17.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0' opacity='.38'/></g></svg>">
<style>
  :root{
    --bg:#f1f1ee; --panel:#ffffff; --line:#e8e8e3; --line2:#d8d8d2;
    --text:#17171a; --muted:#74747a; --faint:#a6a6ab; --chip:#f5f5f2;
    --accent:#17171a; --danger:#cf3f3a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; font:13px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.dragging, body.dragging *{cursor:grabbing!important; user-select:none}
  button{font:inherit; color:inherit}
  svg{display:block; flex:none}
  .sp{flex:1}

  /* ---------- Buttons ---------- */
  .ib{
    width:32px; height:32px; flex:none; display:inline-flex; align-items:center; justify-content:center;
    border-radius:8px; border:0; background:none; cursor:pointer; color:var(--text);
  }
  .ib:hover{background:var(--chip)}
  .ib:disabled{opacity:.28; cursor:default; background:none}
  .ib.sm{width:26px; height:26px; border-radius:7px}
  .ib.pressed{background:var(--chip)}
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px;
    border:1px solid var(--line2); background:var(--panel); cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:var(--chip)}
  .btn:focus-visible, .ib:focus-visible, .seg button:focus-visible{outline:2px solid rgba(23,23,26,.28); outline-offset:2px}
  .btn:disabled{opacity:.4; cursor:default; background:var(--panel)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover, .btn.primary.pressed{background:#34343a}
  .btn.sm{padding:5px 9px; font-size:12px; border-radius:8px; gap:5px}
  .btn.danger:hover{background:#fdf0ef; color:var(--danger); border-color:#f1c6c4}
  .btn.block{width:100%; justify-content:center; padding:10px}
  .seg{display:inline-flex; padding:2px; border-radius:9px; background:var(--chip); box-shadow:inset 0 0 0 1px var(--line)}
  .seg button{border:0; background:none; padding:5px 11px; border-radius:7px; cursor:pointer; font-size:12px; color:var(--muted)}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.1), 0 0 0 1px var(--line)}

  /* ---------- Header ---------- */
  header{
    position:relative; height:54px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px 0 18px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:650; font-size:15.5px; letter-spacing:-.2px; white-space:nowrap; border:0; background:none; padding:4px 6px 4px 4px; margin-left:-4px; border-radius:9px; cursor:pointer}
  .brand:focus-visible{outline:2px solid rgba(23,23,26,.28); outline-offset:2px}
  .vsep{width:1px; height:20px; background:var(--line); margin:0 4px}
  .hcenter{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:4px}
  .mode button{display:inline-flex; align-items:center; gap:6px; padding:5px 12px}
  #btnExportTop{position:relative; overflow:hidden}
  .prog{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.18); pointer-events:none}

  /* ---------- Layout ---------- */
  main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 320px; min-height:0}
  #stage{
    position:relative; min-width:0; min-height:0; overflow:hidden; background-color:var(--bg);
    background-image:radial-gradient(#d9d9d3 1px, transparent 1px); background-size:18px 18px;
  }
  aside{background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; overflow-x:hidden}

  /* ---------- Canvas ---------- */
  #frame{position:absolute}
  #clip{position:absolute; inset:0; border-radius:12px; overflow:hidden; background:#ddd; box-shadow:0 28px 70px rgba(20,20,40,.16), 0 2px 8px rgba(0,0,0,.06)}
  #view{display:block; width:100%; height:100%}
  #handles{position:absolute; inset:0; touch-action:none}
  #handles.off{pointer-events:none}
  .dot{
    position:absolute; width:16px; height:16px; border-radius:50%; border:2.5px solid #fff;
    transform:translate(-50%,-50%); cursor:grab; touch-action:none;
    box-shadow:0 1px 5px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.1); transition:opacity .15s, width .12s, height .12s;
  }
  .dot::after{content:""; position:absolute; inset:-9px; border-radius:50%}
  .dot:hover{width:19px; height:19px}
  .dot.sel{width:20px; height:20px; box-shadow:0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.35)}
  .dot.hl{width:22px; height:22px}
  .dot.dim{opacity:.28}
  .dot.new::before{content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid #fff; animation:ping 1s ease-out 2}
  @keyframes ping{from{transform:scale(1); opacity:1}to{transform:scale(2.6); opacity:0}}
  .outline{position:absolute; border-radius:50%; pointer-events:none; border:1.5px solid rgba(255,255,255,.95); box-shadow:0 0 0 1px rgba(0,0,0,.14), inset 0 0 0 1px rgba(0,0,0,.14)}
  .axis{position:absolute; height:1.5px; background:rgba(255,255,255,.9); transform-origin:0 50%; pointer-events:none; box-shadow:0 0 0 .5px rgba(0,0,0,.2)}
  .knob{position:absolute; width:12px; height:12px; background:#fff; border:1.5px solid var(--accent); border-radius:3px; transform:translate(-50%,-50%); cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.25); touch-action:none}
  .knob::after{content:""; position:absolute; inset:-9px}
  .knob.minor{border-radius:50%}

  .floatbar{
    position:absolute; left:50%; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:2px;
    padding:4px; background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.06);
    max-width:calc(100% - 24px); overflow-x:auto; scrollbar-width:none;
  }
  .floatbar::-webkit-scrollbar{display:none}
  #ratiobar{top:12px}
  #ratiobar button{display:flex; align-items:center; gap:6px; border:0; background:none; padding:5px 9px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--muted); white-space:nowrap}
  #ratiobar button:hover{color:var(--text); background:var(--chip)}
  #ratiobar button.on{background:var(--accent); color:#fff}
  #ratiobar .shape{border:1.5px solid currentColor; border-radius:2px; flex:none}
  #ratiobar button{font-variant-numeric:tabular-nums}
  /* Fixed width that fits up to "6000 × 6000", so typing a size never resizes or re-centers the bar */
  #ratiobar button.custom.on{min-width:104px; justify-content:center}
  #toolbar{left:12px; top:50%; transform:translateY(-50%); flex-direction:column; max-width:none; overflow:visible; padding:5px; gap:2px}
  #toolbar .tb{position:relative; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:0; background:none; border-radius:9px; cursor:pointer; color:var(--text)}
  #toolbar .tb:hover{background:var(--chip)}
  #toolbar .tb:focus-visible{outline:2px solid rgba(23,23,26,.25); outline-offset:1px}
  #toolbar .tsep{width:20px; height:1px; background:var(--line); margin:3px 0}
  /* Tooltip with the action name and shortcut, shown to the right on hover */
  #toolbar .tb::after{
    content:attr(data-tip); position:absolute; left:calc(100% + 10px); top:50%; transform:translate(-4px,-50%);
    background:#17171a; color:#fff; font-size:12px; padding:5px 9px; border-radius:7px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .12s, transform .12s;
  }
  #toolbar .tb:hover::after, #toolbar .tb:focus-visible::after{opacity:1; transform:translate(0,-50%)}
  .sizepop{
    position:absolute; top:58px; left:50%; transform:translateX(-50%); z-index:6; display:flex; align-items:center; gap:8px;
    padding:8px 8px 8px 12px; background:#fff; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06); white-space:nowrap;
  }
  .num{width:76px; font:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--line2); border-radius:8px; background:var(--panel); font-variant-numeric:tabular-nums}
  .num:focus, .hex:focus{outline:2px solid rgba(23,23,26,.18); border-color:var(--accent)}
  .times, .unit{color:var(--faint)}

  .ctxbar{position:absolute; z-index:5; display:flex; align-items:center; gap:2px; padding:4px; background:#fff; border-radius:11px; box-shadow:0 6px 20px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06); white-space:nowrap; transition:opacity .12s}
  body.dragging .ctxbar{opacity:0; pointer-events:none}
  .ctxbar .csw{width:26px; height:26px; margin:2px 4px 2px 2px; border-radius:8px; border:0; padding:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .ctxbar .csw:hover{transform:scale(1.08)}
  .ctxbar .sep{width:1px; height:18px; background:var(--line); margin:0 4px}
  .ctxbar .ib{width:30px; height:30px}
  .ctxbar .ib.danger:hover{background:#fdf0ef; color:var(--danger)}

  #toast{
    position:absolute; left:50%; bottom:16px; transform:translate(-50%,8px); opacity:0; pointer-events:none; z-index:4;
    padding:8px 14px; border-radius:10px; background:#17171a; color:#fff; font-size:12.5px; transition:opacity .18s, transform .18s; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translate(-50%,0)}

  /* ---------- Panel ---------- */
  .sec{padding:16px 18px; border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 12px; font-size:13px; color:var(--text); font-weight:600; display:flex; align-items:center; gap:8px; min-height:24px}
  .sec h3 .meta{font-size:12px; font-weight:400; color:var(--faint)}

  .presets{display:grid; grid-template-columns:repeat(7,minmax(0,48px)); gap:7px; justify-content:start}
  .preset{position:relative; border:0; padding:0; background:none; cursor:pointer; display:block; min-width:0}
  .preset canvas, .preset .blank{display:block; width:100%; aspect-ratio:1; height:auto; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.05); transition:transform .15s, box-shadow .15s}
  .preset .blank{display:flex; align-items:center; justify-content:center; background:#fff; box-shadow:none; border:1.5px dashed #c6c6c0; color:var(--faint)}
  .preset:hover canvas, .preset:hover .blank{transform:translateY(-2px)}
  .preset:hover .blank{color:var(--text); border-color:#a9a9a3}
  .preset.on canvas, .preset.on .blank{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent)}
  /* Name appears on hover only */
  .preset::after{
    content:attr(data-name); position:absolute; left:50%; bottom:calc(100% + 8px); transform:translate(-50%,4px);
    background:#17171a; color:#fff; font-size:12px; padding:4px 8px; border-radius:7px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .12s, transform .12s; z-index:2;
  }
  .preset:hover::after, .preset:focus-visible::after{opacity:1; transform:translate(-50%,0)}

  .addl{display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line2); background:#fff; padding:4px 9px 4px 7px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:500; color:var(--text)}
  .addl:hover{background:var(--chip)}
  .addl:disabled{opacity:.4; cursor:default; background:#fff}
  .layers{display:flex; flex-direction:column; gap:6px}
  .lrow{border-radius:12px; background:var(--chip); transition:background .15s, box-shadow .15s}
  .lrow:hover{background:#eeeee9}
  .lrow.sel{background:#fff; box-shadow:0 0 0 1px var(--line2), 0 2px 10px rgba(0,0,0,.05)}
  .lrow.new{animation:rowin .3s ease-out}
  @keyframes rowin{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
  .lhead{display:flex; align-items:center; gap:10px; padding:7px 6px 7px 8px; cursor:pointer; user-select:none}
  .sw{width:30px; height:30px; flex:none; border-radius:9px; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); transition:transform .12s}
  .sw:hover{transform:scale(1.08)}
  .sw.open{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 0 0 2px #fff, 0 0 0 4px var(--accent)}
  .lname{flex:1; min-width:0; display:flex; align-items:baseline; gap:8px}
  .lname b{font-weight:500; font-size:12.5px}
  .lname span{font:11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); letter-spacing:.2px}
  .lrow .rm{width:26px; height:26px; color:var(--faint); opacity:0; transition:opacity .12s}
  .lrow:hover .rm, .lrow.sel .rm{opacity:1}
  .lrow .rm:hover{color:var(--danger); background:#fdf0ef}
  @media (hover:none){.lrow .rm{opacity:1}}
  .ldiv{height:1px; background:var(--line); margin:4px 2px}
  .cedit{margin:0 10px 10px; padding-top:6px; border-top:1px solid var(--line)}

  .row{display:flex; align-items:center; gap:10px; margin:9px 0}
  .lbl{width:64px; flex:none; color:var(--muted); font-size:12.5px; user-select:none}
  .val{width:38px; flex:none; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px}
  .btnrow{display:flex; gap:6px; align-items:center; margin-top:10px}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:0; height:20px; margin:0; background:transparent; cursor:pointer; --p:50%}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:linear-gradient(to right,var(--accent) var(--p),#e3e3de var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; margin-top:-6px; border-radius:50%; background:#fff; border:1px solid #cfcfc9; box-shadow:0 1px 3px rgba(0,0,0,.2)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(23,23,26,.18)}
  input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:#e3e3de}
  input[type=range]::-moz-range-progress{height:4px; border-radius:2px; background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:#fff; border:1px solid #cfcfc9; box-shadow:0 1px 3px rgba(0,0,0,.2)}

  /* ---------- Popovers ---------- */
  .pop{position:fixed; z-index:55; width:290px; padding:14px; background:#fff; border-radius:14px; box-shadow:0 14px 44px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.06)}
  .pop-title{display:flex; align-items:center; gap:8px; margin:0 0 12px; font-weight:600; font-size:13px}
  .pop .lbl{width:52px}
  /* Recolor: same layout, a different palette */
  .pop.rc{width:276px; padding:12px; max-height:min(560px,calc(100vh - 24px)); overflow-y:auto}
  .rc-head{display:flex; align-items:baseline; justify-content:space-between; margin:2px 4px 10px; font-weight:600; font-size:13px}
  .rc-head span{font-weight:400; font-size:12px; color:var(--faint)}
  .rc-surprise{width:100%; justify-content:center; margin-bottom:8px}
  .rc-row{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:7px 6px; border-radius:9px; cursor:pointer; text-align:left}
  .rc-row:hover{background:var(--chip)}
  .rc-row.on{background:var(--chip); box-shadow:inset 0 0 0 1px var(--line2)}
  .rc-row b{width:66px; flex:none; font-weight:500; font-size:12.5px}
  .rc-strip{flex:1; display:flex; height:22px; border-radius:6px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .rc-strip i{flex:1}
  .rc-strip i:first-child{flex:1.4}
  /* Preview button: red "live" look while playing, solid black when paused */
  #btnPause{margin-top:12px; gap:8px; font-weight:500}
  #btnPause.live{background:#fdeeed; border-color:#f3cbc8; color:#c2372f}
  #btnPause.live:hover{background:#fbe1df}
  #btnPause .live-dot{width:8px; height:8px; border-radius:50%; background:#e5484d; animation:live 1.6s ease-out infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 7px rgba(229,72,77,0)}}
  .help{color:var(--muted); font-size:11.5px; line-height:1.5; margin:10px 0 0}
  .pop.exp{width:288px; padding:14px}
  .exp-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 0 12px; font-weight:600; font-size:13px}
  .exp-head span{font-weight:400; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
  .exp .tabs{display:flex; width:100%; margin-bottom:4px}
  .exp .tabs button{flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 0; font-size:12.5px}
  .exp .row{margin:12px 0 0}
  .exp .row .lbl{width:52px}
  .exp .row .seg{flex:1}
  .exp .row .seg button{flex:1; padding:5px 0}
  .exp .btn.block{margin-top:16px; position:relative; overflow:hidden}
  .exp .note{margin:8px 0 0; font-size:11.5px; color:var(--muted); text-align:center}

  .menu{position:fixed; z-index:60; min-width:200px; padding:5px; background:#fff; border-radius:11px; box-shadow:0 12px 36px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06)}
  .menu button{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:7px 9px; border-radius:7px; cursor:pointer; font-size:12.5px; text-align:left}
  .menu button:hover:not(:disabled){background:var(--chip)}
  .menu button.danger{color:var(--danger)}
  .menu button.danger:hover:not(:disabled){background:#fdf0ef}
  .menu button:disabled{opacity:.38; cursor:default}
  .menu kbd{margin-left:auto; font-family:inherit; font-size:11px; color:var(--faint)}
  .menu hr{border:0; height:1px; background:var(--line); margin:4px 2px}

  #picker{position:fixed; z-index:50; width:240px; padding:12px; border-radius:14px; background:#fff; box-shadow:0 14px 44px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06); display:none}
  #picker.show{display:block}
  .pk-head{display:flex; align-items:center; gap:6px; margin:-2px 0 10px; font-weight:600; font-size:12.5px}
  .pk-sec{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); margin:0 0 8px}
  .pk-sec .ib{width:22px; height:22px; border-radius:6px; color:var(--muted)}
  .pk-recs{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:14px}
  .pk-recs button{aspect-ratio:1; border:0; border-radius:8px; padding:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); transition:transform .12s}
  .pk-recs button:hover{transform:scale(1.12)}
  .pk-recs button.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 0 0 2px #fff, 0 0 0 3.5px var(--accent)}
  .sv{position:relative; height:140px; border-radius:9px; cursor:crosshair; touch-action:none}
  .sv-cur, .hue-cur{position:absolute; width:16px; height:16px; border-radius:50%; border:2.5px solid #fff; transform:translate(-50%,-50%); box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 1px 4px rgba(0,0,0,.3); pointer-events:none}
  .hue{position:relative; height:12px; margin:12px 0; border-radius:6px; cursor:pointer; touch-action:none; background:linear-gradient(to right,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
  .hue-cur{top:50%}
  .pk-row{display:flex; align-items:center; gap:8px}
  .pk-prev{width:30px; height:30px; flex:none; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .hex{flex:1; min-width:0; font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; padding:7px 9px; border:1px solid var(--line2); border-radius:8px; text-transform:uppercase; background:#fff}

  /* ---------- Responsive ---------- */

  }

  /* ---------- First visit: welcome ----------
     Warm off-white page; the moving gradient only shows through a huge "Haze" wordmark. */
  #welcome{position:fixed; inset:0; z-index:200; background:#f3f1ec; color:#17171a; transition:opacity .6s ease}

  .wtop{position:absolute; left:0; right:0; display:flex; justify-content:space-between; padding:0 clamp(20px,4vw,48px); z-index:1}

  .wgo{

    transition:background .15s, transform .15s;

</head>

<script>
/* ================= Icons ================= */
const ICONS={
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  download:'<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
  shuffle:'<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>',
  palette:'<path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A5.7 5.7 0 0 0 22 9.7C22 5.4 17.5 2 12 2z"/><circle cx="7.5" cy="11.5" r="1.3"/><circle cx="10" cy="7" r="1.3"/><circle cx="15" cy="7" r="1.3"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="m3 3 18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2"/><path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  trash:'<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  dropper:'<path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>',
  edit:'<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
  up:'<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>',
  down:'<path d="M12 5v14"/><path d="m6 13 6 6 6-6"/>',
  play:'<path d="M7 5v14l11-7z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  image:'<rect x="4" y="5" width="16" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="m20 16-5-5-8 8"/>',
  wave:'<path d="M3 9c2-2.5 4-2.5 6 0s4 2.5 6 0 4-2.5 6 0"/><path d="M3 15c2-2.5 4-2.5 6 0s4 2.5 6 0 4-2.5 6 0"/>',
  swatches:'<circle cx="9" cy="9.5" r="5"/><circle cx="15" cy="9.5" r="5"/><circle cx="12" cy="15" r="5"/>',
  sparkle:'<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
};
const icon=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
function hydrateIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{if(!el.querySelector('svg'))el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon,+(el.dataset.size||16)));});}

/* ================= Color utils ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hexToRgb(h){h=h.replace('#','');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbToHex(rgb){return '#'+rgb.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}
function rgbToHsl([r,g,b]){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0;const l=(max+min)/2;
  if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
    if(max===r)h=(g-b)/d+(g<b?6:0);else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];}
function hslToRgb([h,s,l]){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const [r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255];}
const hslHex=hsl=>rgbToHex(hslToRgb(hsl));
function rgbToHsv([r,g,b]){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;
  if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return [h,max?d/max:0,max];}
function hsvToRgb([h,s,v]){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return [f(5)*255,f(3)*255,f(1)*255];}
function normHex(s){s=String(s).trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(s))s=s.split('').map(c=>c+c).join('');return /^[0-9a-f]{6}$/i.test(s)?'#'+s.toLowerCase():null;}
function mixHex(a,b,t=.5){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.map((v,i)=>v+(B[i]-v)*t));}
function dist(a,b){const A=hexToRgb(a),B=hexToRgb(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);}

/* ================= Random ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=(a,b,r=Math.random)=>a+r()*(b-a);
let seq=0;const uid=p=>p+(++seq).toString(36)+Math.floor(Math.random()*1296).toString(36);
const shuffled=(a,r=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const k=Math.floor(r()*(i+1));[a[i],a[k]]=[a[k],a[i]];}return a;};

/* ================= Model =================
   The picture is a background color plus up to five soft shapes ("layers").
   Each layer has its own color, position and shape. Layers are stored bottom→top. */
const MAX_LAYERS=5;
const DEF={blur:40,grain:10,ratio:'9:16',w:1080,h:1920,imageFormat:'png',videoFormat:'mp4',motion:{on:false,loop:8,flow:55}};
const LAYER_DEF={size:.38,stretch:1.6,angle:0,soft:.8,alpha:.9};
function makeLayer(hex,o={},r=Math.random){
  return Object.assign({id:uid('l'),hex,x:rnd(.15,.85,r),y:rnd(.15,.85,r),size:rnd(.3,.44,r),stretch:rnd(1.3,2.4,r),angle:rnd(-25,25,r),soft:.8,alpha:rnd(.82,1,r)},o);
}
// Stratified positions so shapes cover the frame instead of clumping.
function scatter(n,r=Math.random){
  const cols=2,rows=Math.max(2,Math.ceil(n/cols)),cells=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)cells.push([i,j]);
  const order=shuffled(cells,r);
  return Array.from({length:n},(_,i)=>{const [cx,cy]=order[i%order.length];return [(cx+.12+r()*.76)/cols,(cy+.12+r()*.76)/rows];});
}

const PRESETS=[
  {name:'Blank',bg:'#f4f4f1',layers:[],seed:1},
  {name:'Sky',bg:'#86bcee',layers:['#5aa7ea','#eaf2fb','#4f9fe6','#eef5fc'],seed:3},
  {name:'Lavender',bg:'#ad97d6',layers:['#9d86cf','#f0d3dc','#8a8fd4','#f2dccb'],seed:7},
  {name:'Sage',bg:'#bfcca9',layers:['#9fb797','#f4e6c3','#97b190','#f6e8c6'],seed:5},
  {name:'Grass',bg:'#58b26d',layers:['#38a85a','#c4e27a','#8dd3e0','#c8e47e'],seed:9},
  {name:'Sunset',bg:'#f5bfaa',layers:['#f4a98c','#fde6d6','#f1a3bd','#fde8d9'],seed:13},
  {name:'Dusk',bg:'#4a4994',layers:['#2b3c80','#7b63d6','#ea85b4','#7f68d9'],seed:21},
];
const presetData=PRESETS.map(p=>{
  const r=mulberry32(p.seed*977),pos=scatter(p.layers.length,r);
  return {name:p.name,bg:p.bg,layers:p.layers.map((h,i)=>makeLayer(h,{x:pos[i][0],y:pos[i][1]},r))};
});

const START=presetData.findIndex(p=>p.name==='Sky');
// Autosave: the current picture is kept in this browser, so a refresh never loses work.
const SAVE_KEY='haze:v1';
function loadSaved(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;
    const s=JSON.parse(raw);
    if(!s||!Array.isArray(s.layers)||!normHex(s.bg||''))return null;
    const base=JSON.parse(JSON.stringify(DEF));
    const layers=s.layers.filter(l=>l&&normHex(l.hex||'')&&isFinite(l.x)&&isFinite(l.y)).slice(0,MAX_LAYERS)
      .map(l=>Object.assign({},LAYER_DEF,l,{id:uid('l'),hex:normHex(l.hex)}));
    const out=Object.assign(base,s,{bg:normHex(s.bg),layers,motion:Object.assign(base.motion,s.motion||{})});
    delete out.format;
    return out;
  }catch(_){return null;}
}
function save(snapshot){try{localStorage.setItem(SAVE_KEY,snapshot);}catch(_){}}
const SAVED=loadSaved();
let state=SAVED||Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(JSON.stringify({bg:presetData[START].bg,layers:presetData[START].layers})));
const ui={exportTab:'image',sel:null,hover:null,showHandles:true,paused:false,pausedAt:0,exporting:false,newLayer:null,previewing:false};
const layerById=id=>state.layers.find(l=>l.id===id);
const selLayer=()=>layerById(ui.sel)||null;

/* ================= Recommendations ================= */
// Recommendations stay inside the picture's mood: they only use hues, saturation
// and lightness that are already present (plus a small margin), built by
//   1) blending two existing colors,
//   2) making an existing color a little lighter or darker,
//   3) nudging an existing hue slightly to a neighbouring one.
// Nothing jumps to a complementary or unrelated hue.
const softPastel=()=>hslHex([rnd(0,360),rnd(40,62),rnd(72,86)]);
function recommend(excludeId){
  const others=state.layers.filter(l=>l.id!==excludeId).map(l=>l.hex);
  if(excludeId!=='bg')others.push(state.bg);
  const hsl=others.map(h=>rgbToHsl(hexToRgb(h)));
  // A color only steers the hue if it is visibly colored (not near white, gray or black).
  const chroma=h=>{const c=hexToRgb(h);return Math.max(...c)-Math.min(...c);};
  const tinted=hsl.filter((c,i)=>chroma(others[i])>24);
  if(!tinted.length){const out=[];while(out.length<6){const h=softPastel();if(!out.some(x=>dist(x,h)<40))out.push(h);}return out;}
  const S=hsl.map(c=>c[1]),L=hsl.map(c=>c[2]);
  const TS=tinted.map(c=>c[1]),sLo=Math.max(8,Math.min(...S)-6),sHi=Math.min(100,Math.max(...TS)+2);
  const lLo=Math.max(12,Math.min(...L)-10),lHi=Math.min(96,Math.max(...L)+10);
  const fit=([h,s,l])=>hslHex([h,clamp(s,sLo,sHi),clamp(l,lLo,lHi)]);
  const J=a=>(Math.random()*2-1)*a,pick=a=>a[Math.floor(Math.random()*a.length)];
  const cands=[];
  for(let i=0;i<14&&others.length>1;i++){ // blends
    const a=pick(others),b=pick(others);if(a===b)continue;
    const m=rgbToHsl(hexToRgb(mixHex(a,b,rnd(.3,.7))));m[1]*=1.12;cands.push(fit(m));
  }
  for(const c of tinted){ // lighter / darker versions
    cands.push(fit([c[0]+J(5),c[1]+J(5),c[2]+rnd(8,15)]));
    cands.push(fit([c[0]+J(5),c[1]+J(5),c[2]-rnd(8,15)]));
  }
  for(const c of tinted){ // neighbouring hues
    const d=(Math.random()<.5?-1:1)*rnd(10,18);
    cands.push(fit([c[0]+d,c[1]*rnd(.82,.98),c[2]+J(5)]));
  }
  const out=[];
  for(const minOther of [30,22,14])for(const h of shuffled(cands)){
    if(out.length===6)break;
    if(others.some(x=>dist(x,h)<minOther)||out.some(x=>dist(x,h)<24))continue;
    out.push(h);
  }
  while(out.length<6)out.push(fit([pick(tinted)[0]+J(20),rnd(sLo,sHi),rnd(lLo,lHi)]));
  // Order by hue, then lightness, so the six read as one tidy palette.
  return out.map(h=>[h,rgbToHsl(hexToRgb(h))]).sort((a,b)=>(Math.round(a[1][0]/20)-Math.round(b[1][0]/20))||(b[1][2]-a[1][2])).map(x=>x[0]);
}

/* ================= Render pipeline ================= */
const lowA=document.createElement('canvas'),lowB=document.createElement('canvas'),tmpC=document.createElement('canvas');
const HAS_FILTER='filter' in CanvasRenderingContext2D.prototype;
const noiseTile=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const im=x.createImageData(256,256);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);return c;})();
// Motion: every layer drifts, breathes and sways on its own seeded path. The
// frequencies are whole numbers, so phase 0 and phase 1 match and loops are seamless.
const seedCache=new Map();
function seedsOf(id){
  let v=seedCache.get(id);
  if(!v){let h=2166136261;for(const ch of id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}const r=mulberry32(h);v=[r(),r(),r(),r(),r(),r()];seedCache.set(id,v);}
  return v;
}
function motionOf(b,t,k){
  const [a1,a2,a3,a4,a5,a6]=seedsOf(b.id),T=Math.PI*2,f1=a1<.5?1:2,f2=a2<.5?1:2,A=.13*k;
  return {dx:A*Math.sin(T*(f1*t+a3)),dy:A*.85*Math.sin(T*(f2*t+a4)),ds:1+.14*k*Math.sin(T*(t+a5)),da:22*k*Math.sin(T*(t+a6))};
}
function renderTo(canvas,W,H,s=state,phase=null){
  if(!(W>=1&&H>=1&&isFinite(W)&&isFinite(H)))return;
  const anim=phase!==null&&s.motion&&s.motion.on,k=anim?s.motion.flow/100:0;
  const LW=Math.max(40,Math.round(Math.sqrt(230400*W/H))),LH=Math.max(40,Math.round(LW*H/W));
  const U=Math.sqrt(LW*LH),M=Math.round(U*.35);
  lowA.width=lowB.width=LW+2*M;lowA.height=lowB.height=LH+2*M;
  const o=lowA.getContext('2d');
  o.globalAlpha=1;o.fillStyle=s.bg;o.fillRect(0,0,lowA.width,lowA.height);
  for(const b of s.layers){
    let bx=b.x,by=b.y,bs=b.size,ba=b.angle;
    if(anim){const m=motionOf(b,phase,k);bx+=m.dx;by+=m.dy;bs*=m.ds;ba+=m.da;}
    const r=bs*U,sx=Math.sqrt(b.stretch);
    o.save();o.translate(M+bx*LW,M+by*LH);o.rotate(ba*Math.PI/180);o.scale(sx,1/sx);
    const g=o.createRadialGradient(0,0,0,0,0,r);
    g.addColorStop(0,b.hex);g.addColorStop(clamp(1-b.soft,.02,.98),b.hex);g.addColorStop(1,b.hex+'00');
    o.globalAlpha=b.alpha;o.fillStyle=g;o.beginPath();o.arc(0,0,r,0,Math.PI*2);o.fill();o.restore();
  }
  const p=lowB.getContext('2d');p.clearRect(0,0,lowB.width,lowB.height);
  const bl=s.blur/100*.075*U;
  if(bl>.1&&HAS_FILTER){p.filter=`blur(${bl.toFixed(1)}px)`;p.drawImage(lowA,0,0);p.filter='none';}
  else if(bl>.1){ // fallback for browsers without canvas filters: downscale + smooth upscale
    const f=Math.max(1,bl/1.6);tmpC.width=Math.max(2,Math.round(lowA.width/f));tmpC.height=Math.max(2,Math.round(lowA.height/f));
    const t=tmpC.getContext('2d');t.imageSmoothingQuality='high';t.drawImage(lowA,0,0,tmpC.width,tmpC.height);
    p.imageSmoothingQuality='high';p.drawImage(tmpC,0,0,lowB.width,lowB.height);
  } else p.drawImage(lowA,0,0);
  if(canvas.width!==W)canvas.width=W;if(canvas.height!==H)canvas.height=H;
  const ctx=canvas.getContext('2d');ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(lowB,M,M,LW,LH,0,0,W,H);
  if(s.grain>0){
    const pat=ctx.createPattern(noiseTile,'repeat'),gk=Math.max(.35,Math.sqrt(W*H)/1440);
    if(pat.setTransform)pat.setTransform(new DOMMatrix().scale(gk)); // fixed texture, never re-randomized per frame
    ctx.save();ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=s.grain/100*1.6;ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);ctx.restore();
  }
}

const $=id=>document.getElementById(id);
const stage=$('stage'),frame=$('frame'),view=$('view'),handles=$('handles');

function requestRender(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawPreview();});}
function phaseNow(){if(ui.paused)return ui.pausedAt;const L=state.motion.loop*1000;return (performance.now()%L)/L;}
function drawPreview(){const w=frame.clientWidth,h=frame.clientHeight;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2);renderTo(view,Math.round(w*dpr),Math.round(h*dpr),state,state.motion.on?phaseNow():null);}
function tick(){animRaf=0;if(!state.motion.on||ui.paused||ui.exporting||!$('welcome').hidden)return;drawPreview();positionHandles();animRaf=requestAnimationFrame(tick);}

/* ================= History ================= */
const hist={stack:[],i:-1,timer:0};
function commit(now){
  clearTimeout(hist.timer);hist.timer=0;
  const run=()=>{hist.timer=0;const s=JSON.stringify(state);save(s);renderPresets();if(s===hist.stack[hist.i]){updateUndoUI();return;}
    hist.stack=hist.stack.slice(0,hist.i+1);hist.stack.push(s);
    if(hist.stack.length>200)hist.stack.shift();hist.i=hist.stack.length-1;updateUndoUI();};
  if(now)run();else{hist.timer=setTimeout(run,320);updateUndoUI();}
}
function flush(){if(hist.timer)commit(true);}
function restore(s){state=JSON.parse(s);if(ui.sel&&!selLayer())ui.sel=null;closePicker(true);renderAll();fitFrame();updateUndoUI();}
function undo(){flush();if(hist.i<=0)return;hist.i--;restore(hist.stack[hist.i]);}
function redo(){flush();if(hist.i>=hist.stack.length-1)return;hist.i++;restore(hist.stack[hist.i]);}
function updateUndoUI(){$('btnUndo').disabled=hist.i<=0&&!hist.timer;$('btnRedo').disabled=hist.i>=hist.stack.length-1||!!hist.timer;}
$('btnUndo').onclick=undo;$('btnRedo').onclick=redo;

let toastT=0;

// Pick a spot far from existing shapes so a new one is easy to find.
function freeSpot(){
  let best=[.5,.5],bestD=-1;
  for(let i=0;i<24;i++){const p=[rnd(.15,.85),rnd(.15,.85)];const d=Math.min(9,...state.layers.map(b=>Math.hypot(b.x-p[0],b.y-p[1])));if(d>bestD){bestD=d;best=p;}}
  return best;
}
function addLayer({hex,at,openEditor=true}={}){
  if(state.layers.length>=MAX_LAYERS)return null;
  const recs=recommend(null);hex=hex||recs[Math.floor(Math.random()*recs.length)];
  const [x,y]=at||freeSpot();
  const l=makeLayer(hex,{x,y});state.layers.push(l);
  ui.sel=l.id;ui.newLayer=l.id;
  closePicker(true);renderAll();commit(true);ui.newLayer=null;
  if(openEditor){const sw=document.querySelector(`.lrow[data-id="${l.id}"] .sw`);if(sw)openPicker({kind:'layer',id:l.id},sw,{isNew:true,recs:recs.includes(hex)?recs:null});}
  return l;
}
function deleteLayer(id=ui.sel){
  if(!id||!layerById(id))return;
  if(picker.target?.id===id)closePicker(true);
  state.layers=state.layers.filter(l=>l.id!==id);if(ui.sel===id)ui.sel=null;
  renderAll();commit(true);
}
function duplicateLayer(){
  const cur=selLayer();if(!cur)return;
  if(state.layers.length>=MAX_LAYERS){toast(`Up to ${MAX_LAYERS} shapes`);return;}
  const l=Object.assign({},cur,{id:uid('l'),x:clamp(cur.x+.07,-.2,1.2),y:clamp(cur.y+.05,-.2,1.2)});
  state.layers.splice(state.layers.indexOf(cur)+1,0,l);ui.sel=l.id;renderAll();commit(true);
}
function moveLayer(front){
  const l=selLayer();if(!l)return;
  state.layers=state.layers.filter(x=>x!==l);front?state.layers.push(l):state.layers.unshift(l);
  renderAll();commit(true);
}
function shuffle(){
  if(!state.layers.length)return;
  const pos=scatter(state.layers.length);
  state.layers.forEach((b,i)=>{b.x=pos[i][0];b.y=pos[i][1];b.size=rnd(.28,.48);b.stretch=rnd(1.1,2.6);b.angle=rnd(-35,35);});
  renderAll();commit(true);
}
// Keep every shape where it is, but trade colors between them.
function shuffleColors(){
  const hexes=state.layers.map(l=>l.hex);
  if(new Set(hexes).size<2){toast('Use at least two different colors to shuffle');return;}
  let next=hexes;for(let t=0;t<20&&next.join()===hexes.join();t++)next=shuffled(hexes);
  state.layers.forEach((l,i)=>{l.hex=next[i];});
  renderAll();commit(true);
}

  } else {
    segRow('Format',VIDEO_FORMATS.map(f=>[f[0],f[1]]),state.videoFormat,v=>state.videoFormat=v);
    segRow('Length',[4,6,8,12].map(v=>[v,v+'s']),state.motion.loop,v=>{state.motion.loop=v;renderMotion();});
    btn.innerHTML=icon('download')+`Download ${FMT_NAME[state.videoFormat]} · ${state.motion.loop}s`;
    btn.onclick=exportVideo;body.appendChild(btn);
    const p=document.createElement('p');p.className='note';p.textContent='Plays as a seamless loop';body.appendChild(p);
  }
}
function download(blob,ext){
  const ratio=state.ratio==='Custom'?'custom':state.ratio.replace(':','x');
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`haze-${ratio}-${state.w}x${state.h}.${ext}`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);
}
function exportImage(){
  if(ui.exporting)return;
  const fmt=state.imageFormat,c=document.createElement('canvas');ui.exportTab='image';
  renderTo(c,state.w,state.h,state,state.motion.on?phaseNow():null);closePops();
  c.toBlob(blob=>{if(!blob){toast('Export failed. Try a smaller size.');return;}download(blob,fmt);},{png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[fmt],.95);
}
async function exportVideo(){
  if(ui.exporting)return;
  const fmt=state.videoFormat,mime=videoMime(fmt);if(!mime){toast(`This browser can't record ${FMT_NAME[fmt]}`);return;}
  ui.exportTab='video';if(!state.motion.on)setMotion(true);
  const W=state.w-state.w%2,H=state.h-state.h%2,c=document.createElement('canvas');c.width=W;c.height=H;
  renderTo(c,W,H,state,0);
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:16e6}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const top=$('btnExportTop'),dur=state.motion.loop*1000;
  ui.exporting=true;top.disabled=true;closePops();
  const done=new Promise(r=>rec.onstop=r);
  rec.start();const t0=performance.now();
  await new Promise(res=>{
    const step=()=>{
      const el=performance.now()-t0;if(el>=dur){res();return;}
      renderTo(c,W,H,state,el/dur);
      const pct=(el/dur*100).toFixed(1);
      top.innerHTML=`<span class="prog" style="width:${pct}%"></span>${icon('download')}<span class="lab">Recording ${Math.ceil((dur-el)/1000)}s</span>`;
      requestAnimationFrame(step);
    };step();
  });
  rec.stop();await done;
  ui.exporting=false;top.disabled=false;top.innerHTML=icon('download')+'<span class="lab">Export</span>';renderExport();syncAnim();
  download(new Blob(chunks,{type:mime.split(';')[0]}),fmt);
}
// ⌘E repeats the last kind of export (image or video).
function doExport(){if(ui.exporting)return;ui.exportTab==='video'?exportVideo():exportImage();}

/* ================= Canvas handles ================= */
// Where a layer is drawn right now: its saved position plus the motion offset
// (when Motion is on). Handles use this so dots stay on top of their shapes.
function motionDelta(b){
  if(!state.motion.on)return {dx:0,dy:0,ds:1,da:0};
  return motionOf(b,phaseNow(),state.motion.flow/100);
}
function geo(b){
  const m=motionDelta(b),fw=frame.clientWidth,fh=frame.clientHeight,U=Math.sqrt(fw*fh),sx=Math.sqrt(b.stretch),
        r=b.size*m.ds*U,ang=b.angle+m.da,a=ang*Math.PI/180;
  return {U,sx,cx:(b.x+m.dx)*fw,cy:(b.y+m.dy)*fh,RM:r*sx,rm:r/sx,a,ang,m};
}
function el(cls,css){const d=document.createElement('div');d.className=cls;Object.assign(d.style,css);return d;}
const H={dots:new Map(),outline:null,axis:null,kM:null,km:null};
function renderHandles(){
  handles.innerHTML='';H.dots.clear();H.outline=H.axis=H.kM=H.km=null;
  handles.classList.toggle('off',!ui.showHandles);
  if(!ui.showHandles){renderCtx();return;}
  const sel=selLayer();
  if(sel){H.outline=el('outline',{});H.axis=el('axis',{});handles.append(H.outline,H.axis);}
  for(const b of state.layers){
    let cls='dot'+(b.id===ui.sel?' sel':'')+(b.id===ui.newLayer?' new':'');
    if(ui.hover)cls+=b.id===ui.hover?' hl':' dim';
    const d=el(cls,{background:b.hex});
    d.title='Drag to move';
    d.addEventListener('pointerdown',e=>startMove(e,b));
    d.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();ui.sel=b.id;renderLayers();renderHandles();layerMenu(e.clientX,e.clientY);});
    handles.appendChild(d);H.dots.set(b.id,d);
  }
  if(sel){
    H.kM=el('knob major',{});H.kM.title='Drag to resize and rotate';H.kM.addEventListener('pointerdown',e=>startKnob(e,sel,'major'));
    H.km=el('knob minor',{});H.km.title='Drag to stretch or squash';H.km.addEventListener('pointerdown',e=>startKnob(e,sel,'minor'));
    handles.append(H.kM,H.km);
  }
  renderCtx();
  positionHandles();
}
// Moves the existing handle elements without rebuilding them; runs every frame
// while Motion plays, so clicks on dots, knobs and the floating bar keep working.
function positionHandles(){
  if(!ui.showHandles)return;
  for(const b of state.layers){
    const d=H.dots.get(b.id);if(!d)continue;
    const g=geo(b);d.style.left=g.cx+'px';d.style.top=g.cy+'px';
  }
  const sel=selLayer();
  if(sel&&H.outline){
    const g=geo(sel);
    Object.assign(H.outline.style,{left:g.cx+'px',top:g.cy+'px',width:2*g.RM+'px',height:2*g.rm+'px',transform:`translate(-50%,-50%) rotate(${g.ang}deg)`});
    Object.assign(H.axis.style,{left:g.cx+'px',top:g.cy+'px',width:g.RM+'px',transform:`rotate(${g.ang}deg)`});
    Object.assign(H.kM.style,{left:g.cx+Math.cos(g.a)*g.RM+'px',top:g.cy+Math.sin(g.a)*g.RM+'px'});
    Object.assign(H.km.style,{left:g.cx-Math.sin(g.a)*g.rm+'px',top:g.cy+Math.cos(g.a)*g.rm+'px'});
  }
  positionCtx();
}
// The "dragging" state (which hides the floating bar) only starts once the
// pointer really moves, so a plain click doesn't make the bar blink.
function track(e,onMove){
  e.preventDefault();e.stopPropagation();
  const sx=e.clientX,sy=e.clientY;let moving=false;
  const move=ev=>{if(!moving){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<3)return;moving=true;document.body.classList.add('dragging');}onMove(ev);};
  const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);document.body.classList.remove('dragging');commit(true);};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function startMove(e,b){
  if(e.button!==0)return;
  closePicker();hideMenu();
  if(ui.sel!==b.id){ui.sel=b.id;renderLayers();}
  renderHandles();
  const r=frame.getBoundingClientRect(),g0=geo(b),ox=e.clientX-(r.left+g0.cx),oy=e.clientY-(r.top+g0.cy);
  track(e,ev=>{
    const m=motionDelta(b);
    b.x=clamp((ev.clientX-ox-r.left)/r.width-m.dx,-.2,1.2);b.y=clamp((ev.clientY-oy-r.top)/r.height-m.dy,-.2,1.2);
    positionHandles();requestRender();
  });
}
function startKnob(e,b,which){
  if(e.button!==0)return;
  const r=frame.getBoundingClientRect();
  track(e,ev=>{
    const g=geo(b),dx=ev.clientX-r.left-g.cx,dy=ev.clientY-r.top-g.cy;
    if(which==='major'){
      let ang=Math.atan2(dy,dx)*180/Math.PI-g.m.da;
      while(ang>90)ang-=180;while(ang<-90)ang+=180;
      b.angle=Math.round(ang);b.size=clamp(Math.hypot(dx,dy)/(g.sx*g.U*g.m.ds),.06,1);
    } else {
      const m=Math.max(2,Math.abs(-Math.sin(g.a)*dx+Math.cos(g.a)*dy)),M=g.RM;
      b.stretch=clamp(M/m,.3,4);b.size=clamp(M/(Math.sqrt(b.stretch)*g.U*g.m.ds),.06,1);
    }
    positionHandles();layerShows.forEach(f=>f());requestRender();
  });
}
handles.addEventListener('pointerdown',e=>{
  if(e.target!==handles)return;
  if(picker.target){closePicker();return;}
  if(ui.sel){ui.sel=null;renderLayers();renderHandles();}

handles.addEventListener('contextmenu',e=>{
  if(e.target!==handles)return;e.preventDefault();
  const r=frame.getBoundingClientRect(),at=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];

    {icon:'shuffle',label:'Shuffle layout',kbd:'R',run:shuffle},

// Clicking anywhere outside the selected shape (except the side panel and popovers) deselects it.

/* ================= Recolor =================
   Keep every shape exactly where it is and swap in a whole new palette.
   Colors are matched by lightness: the lightest shape gets the palette's lightest
   color, the darkest gets the darkest, so the picture's light and shade survive. */
const PALETTES=PRESETS.filter(p=>p.layers.length).map(p=>({name:p.name,bg:p.bg,colors:p.layers})).concat([
  {name:'Mint',bg:'#97cdd5',colors:['#6fb9cc','#d8eaa6','#a8dccd','#dcedab']},
  {name:'Ocean',bg:'#3a7fb0',colors:['#1f4e79','#4fa3c7','#a6dcef','#e6f6fb']},
  {name:'Rose',bg:'#e7b3bd',colors:['#d77f94','#f6dbe0','#c49bbb','#fbeef0']},
  {name:'Citrus',bg:'#f2cf5b',colors:['#f6a33b','#fbeaa0','#9fd36a','#fff6d8']},
  {name:'Mono',bg:'#c9c9c4',colors:['#8f8f8a','#e9e8e3','#b3b3ad','#f7f6f2']},
]);
const lightOf=h=>rgbToHsl(hexToRgb(h))[2];
const RC={base:null,active:null};
const colorsNow=()=>({bg:state.bg,hexes:state.layers.map(l=>l.hex)});
function mapPalette(pal,base){
  const n=base.hexes.length,cols=pal.colors.slice().sort((a,b)=>lightOf(a)-lightOf(b)),m=cols.length;
  const order=base.hexes.map((h,i)=>i).sort((a,b)=>lightOf(base.hexes[a])-lightOf(base.hexes[b]));
  const hexes=new Array(n);
  order.forEach((idx,rank)=>{hexes[idx]=cols[n<=1?m-1:Math.round(rank*(m-1)/(n-1))];});
  return {bg:pal.bg,hexes};
}
function setColors(c){state.bg=c.bg;state.layers.forEach((l,i)=>{if(c.hexes[i])l.hex=c.hexes[i];});renderLayers();renderHandles();requestRender();}
// A fresh, harmonious palette: one base hue, close neighbours, a spread of light and dark.
function surprisePalette(){
  const h=rnd(0,360),s=rnd(38,72),dir=Math.random()<.5?-1:1;
  const colors=[[h,s,rnd(42,55)],[h+dir*rnd(15,30),s*.9,rnd(62,72)],[h-dir*rnd(10,25),s*.6,rnd(84,93)],[h+dir*rnd(30,50),s*.8,rnd(52,66)]].map(hslHex);
  return {name:'Surprise',bg:hslHex([h+dir*8,s*.75,rnd(62,72)]),colors};
}
function renderRecolor(){
  const box=$('rcList');box.innerHTML='';
  PALETTES.forEach(pal=>{
    const b=document.createElement('button');b.className='rc-row'+(RC.active===pal.name?' on':'');b.setAttribute('role','menuitem');
    b.innerHTML=`<b>${pal.name}</b><span class="rc-strip">${[pal.bg,...pal.colors].map(h=>`<i style="background:${h}"></i>`).join('')}</span>`;
    b.onmouseenter=()=>{flush();setColors(mapPalette(pal,RC.base));};
    b.onmouseleave=()=>setColors(RC.base);
    b.onclick=()=>{setColors(mapPalette(pal,RC.base));RC.base=colorsNow();RC.active=pal.name;commit(true);renderRecolor();};
    box.appendChild(b);
  });
}
function openRecolor(){
  const p=$('recolorPop'),a=$('btnRecolor');
  if(!p.hidden){closePops();return;}
  closePops();closePicker(true);hideMenu();
  RC.base=colorsNow();RC.active=null;renderRecolor();
  p.hidden=false;a.classList.add('pressed');p.dataset.anchor='btnRecolor';
  const r=a.getBoundingClientRect(),h=p.offsetHeight,w=p.offsetWidth;
  p.style.left=clamp(r.right+10,8,innerWidth-w-8)+'px';p.style.top=clamp(r.top+r.height/2-h/2,8,innerHeight-h-8)+'px';
}
$('btnRecolor').onclick=openRecolor;

/* ================= Color picker =================
   One picker for every color: a shape's color or the background. Recommended
   colors sit on top (hover to preview on the canvas), a full picker below. */
const picker={el:$('picker'),target:null,hsv:[0,0,1],recs:[],isNew:false};
const sameTarget=(a,b)=>a&&b&&a.kind===b.kind&&a.id===b.id;
const targetHex=t=>t.kind==='bg'?state.bg:layerById(t.id)?.hex;
function setHex(t,hex){if(t.kind==='bg')state.bg=hex;else{const l=layerById(t.id);if(l)l.hex=hex;}}
function openPicker(target,anchor,{isNew=false,recs=null}={}){
  if(sameTarget(picker.target,target)){closePicker();return;}
  closePicker(true);
  const hex=targetHex(target);if(!hex||!anchor)return;
  picker.target=target;picker.hsv=rgbToHsv(hexToRgb(hex));picker.isNew=isNew;
  picker.recs=recs||recommend(target.kind==='bg'?'bg':target.id);
  picker.el.classList.add('show');paintPicker();positionPicker(anchor);
  renderLayers();
}
function positionPicker(anchor){
  const r=anchor.getBoundingClientRect(),pw=picker.el.offsetWidth,ph=picker.el.offsetHeight,vw=innerWidth,vh=innerHeight;
  let left=clamp(r.left-8,8,vw-pw-8),top=r.bottom+10;
  if(top+ph>vh-8)top=r.top-ph-10;
  if(top<8)top=clamp(r.top,8,vh-ph-8);
  picker.el.style.left=left+'px';picker.el.style.top=top+'px';
}
function closePicker(silent){
  if(!picker.target)return;
  if(ui.previewing)previewHex(null);
  picker.target=null;picker.el.classList.remove('show');
  if(!silent)renderLayers();
}
function paintPicker(){
  const t=picker.target;if(!t)return;
  const [h,s,v]=picker.hsv,hex=rgbToHex(hsvToRgb(picker.hsv));
  $('pkTitle').textContent=t.kind==='bg'?'Background':picker.isNew?'New shape':'Shape color';
  $('pkSV').style.background=`linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,rgba(255,255,255,0)),hsl(${h},100%,50%)`;
  Object.assign($('pkSVCur').style,{left:s*100+'%',top:(1-v)*100+'%',background:hex});
  Object.assign($('pkHueCur').style,{left:h/360*100+'%',background:`hsl(${h},100%,50%)`});
  $('pkPrev').style.background=hex;
  if(document.activeElement!==$('pkHex'))$('pkHex').value=hex.toUpperCase();
  const box=$('pkRecs');box.innerHTML='';
  picker.recs.forEach(rh=>{
    const b=document.createElement('button');b.style.background=rh;b.title=rh.toUpperCase();
    b.classList.toggle('on',dist(rh,hex)<6);
    b.onmouseenter=()=>previewHex(rh);b.onmouseleave=()=>previewHex(null);
    b.onclick=()=>{ui.previewing=false;setTargetHex(rh);commit(true);};
    box.appendChild(b);
  });
}
function setTargetHex(hex,fromHsv=false){
  const t=picker.target;if(!t)return;
  setHex(t,hex);
  if(!fromHsv)picker.hsv=rgbToHsv(hexToRgb(hex));
  paintPicker();refreshColors();commit();
}
// Light refresh while a color changes: list swatches, canvas dots and the canvas.
function refreshColors(){
  document.querySelectorAll('#layers .lrow').forEach(row=>{
    const isBg=row.classList.contains('bg'),hex=isBg?state.bg:layerById(row.dataset.id)?.hex;if(!hex)return;
    row.querySelector('.sw').style.background=hex;row.querySelector('.lname span').textContent=hex.slice(1).toUpperCase();
  });
  renderHandles();requestRender();
}
function previewHex(h){
  const t=picker.target;if(!t)return;
  if(h){flush();ui.previewing=true;setHex(t,h);}
  else{if(!ui.previewing)return;ui.previewing=false;setHex(t,rgbToHex(hsvToRgb(picker.hsv)));}
  refreshColors();
}
function dragArea(area,fn){
  area.addEventListener('pointerdown',e=>{
    e.preventDefault();area.setPointerCapture(e.pointerId);
    const go=ev=>{const r=area.getBoundingClientRect();fn(clamp((ev.clientX-r.left)/r.width,0,1),clamp((ev.clientY-r.top)/r.height,0,1));};
    go(e);
    const up=()=>{area.removeEventListener('pointermove',go);area.removeEventListener('pointerup',up);area.removeEventListener('pointercancel',up);commit(true);};
    area.addEventListener('pointermove',go);area.addEventListener('pointerup',up);area.addEventListener('pointercancel',up);
  });
}
const applyHsv=()=>setTargetHex(rgbToHex(hsvToRgb(picker.hsv)),true);
dragArea($('pkSV'),(x,y)=>{picker.hsv[1]=x;picker.hsv[2]=1-y;applyHsv();});
dragArea($('pkHue'),x=>{picker.hsv[0]=Math.min(x*360,359.9);applyHsv();});
$('pkHex').addEventListener('input',e=>{const h=normHex(e.target.value);if(h&&e.target.value.replace('#','').length===6)setTargetHex(h);});
$('pkHex').addEventListener('change',e=>{const h=normHex(e.target.value);if(h)setTargetHex(h);paintPicker();});
$('pkHex').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
$('pkHex').addEventListener('blur',()=>{if(picker.target)$('pkHex').value=rgbToHex(hsvToRgb(picker.hsv)).toUpperCase();});
$('pkClose').onclick=()=>closePicker();
$('pkMore').onclick=()=>{const t=picker.target;if(!t)return;picker.recs=recommend(t.kind==='bg'?'bg':t.id);paintPicker();};
if('EyeDropper' in window){
  $('pkDrop').onclick=async()=>{try{const r=await new EyeDropper().open();const h=normHex(r.sRGBHex);if(h){setTargetHex(h);commit(true);}}catch(_){}};
} else $('pkDrop').hidden=true;
document.addEventListener('pointerdown',e=>{
  if(!picker.target)return;
  if(picker.el.contains(e.target)||e.target.closest('[data-anchor]'))return;
  if(e.target===handles)return; // handled by the canvas listener
  closePicker();
},true);

/* ================= Keyboard ================= */
window.addEventListener('keydown',e=>{
  if(!$('welcome').hidden){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('wGo').click();}return;}
  const t=e.target,isRange=t.type==='range';
  const typing=!isRange&&t.closest&&t.closest('input,textarea,select,[contenteditable]');
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'&&!typing){e.preventDefault();redo();return;}
  if(typing)return;
  if(mod&&k==='e'){e.preventDefault();doExport();return;}
  if(e.key==='Escape'){
    if(document.querySelector('.pop:not([hidden])')){closePops();return;}
    if(!menu.hidden){hideMenu();return;}
    if(picker.target)closePicker();else if(ui.sel){ui.sel=null;renderLayers();renderHandles();}
    return;
  }
  if((e.key==='Delete'||e.key==='Backspace')&&ui.sel){e.preventDefault();deleteLayer();return;}
  if(mod&&k==='d'&&ui.sel){e.preventDefault();duplicateLayer();return;}
  if(mod)return;
  if(k==='h'){toggleHandles();return;}
  if(k==='r'){shuffle();return;}
  if(k==='c'){shuffleColors();return;}
  if(k==='p'){openRecolor();return;}
  if(k==='m'){setMotion(!state.motion.on);return;}
  if(e.key.startsWith('Arrow')&&ui.sel&&!isRange){
    e.preventDefault();const b=selLayer(),st=e.shiftKey?.03:.006;
    if(e.key==='ArrowLeft')b.x-=st;if(e.key==='ArrowRight')b.x+=st;if(e.key==='ArrowUp')b.y-=st;if(e.key==='ArrowDown')b.y+=st;
    b.x=clamp(b.x,-.2,1.2);b.y=clamp(b.y,-.2,1.2);renderHandles();requestRender();commit();
  }
});

/* ================= Layout ================= */
function fitFrame(){
  // Side padding leaves room for the vertical toolbar on the left (kept symmetric so the canvas stays centered).
  const sw=stage.clientWidth,sh=stage.clientHeight,top=60,bottom=24,pad=64;
  const aw=Math.max(40,sw-pad*2),ah=Math.max(40,sh-top-bottom),ar=state.w/state.h;
  let w=aw,h=w/ar;if(h>ah){h=ah;w=h*ar;}
  Object.assign(frame.style,{width:w+'px',height:h+'px',left:(sw-w)/2+'px',top:top+(ah-h)/2+'px'});
  renderHandles();requestRender();
  if(picker.target)closePicker();
}
new ResizeObserver(()=>fitFrame()).observe(stage);

function renderAll(){renderPresets();renderLayers();renderLook();renderMotion();renderExport();renderRatioBar();renderToolbar();renderHandles();requestRender();syncAnim();}

/* ================= First visit: welcome screen =================
   Only a moving gradient, the name and one button. The background slowly
   drifts between a few moods to show what Haze makes. */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W_MOODS=['Sky','Lavender','Sunset','Sage','Grass'].map(n=>presetData.findIndex(p=>p.name===n)).filter(i=>i>=0);
const W={k:0,raf:0,timer:0,state:null};
// The welcome page opens every time Haze is opened.
function shouldWelcome(){return true;}
const wOff=document.createElement('canvas');
// Paint the moving gradient, then keep it only inside a giant "Haze" wordmark.
// The gradient is fitted to the word itself, so the whole composition shows in the letters.
function drawWelcome(){
  const c=$('wcv'),dpr=Math.min(devicePixelRatio||1,2),vw=innerWidth,vh=innerHeight;
  if(vw<40||vh<40)return; // window not laid out yet; the next frame will draw
  const cw=Math.round(vw*dpr),ch=Math.round(vh*dpr);
  if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch;}
  const ctx=c.getContext('2d');ctx.clearRect(0,0,cw,ch);ctx.save();
  const font=s=>`800 ${s}px -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif`;
  const setSize=s=>{ctx.font=font(s);if('letterSpacing' in ctx)ctx.letterSpacing=(-.045*s)+'px';};
  const box=()=>{const m=ctx.measureText('Haze');return {l:m.actualBoundingBoxLeft,r:m.actualBoundingBoxRight,a:m.actualBoundingBoxAscent,d:m.actualBoundingBoxDescent};};
  setSize(100);let b=box();
  const size=Math.min(100*(cw*.72)/(b.l+b.r),100*(ch*.32)/(b.a+b.d));
  if(!isFinite(size)||size<=0){ctx.restore();return;}
  setSize(size);b=box();
  const tw=b.l+b.r,th=b.a+b.d,x=(cw-tw)/2+b.l,y=ch*.44-th/2+b.a;
  if(!(tw>0&&th>0)){ctx.restore();return;}
  $('welcome').style.setProperty('--wb',Math.round((y+b.d)/dpr+Math.max(28,vh*.05))+'px');
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle='#000';ctx.fillText('Haze',x,y);
  // gradient sized to the word's box (plus a little bleed)
  const pad=th*.12,gx=(cw-tw)/2-pad,gy=y-b.a-pad,gw=tw+pad*2,gh=th+pad*2,L=10000;
  renderTo(wOff,560,Math.max(40,Math.round(560*gh/gw)),W.state,REDUCED?.2:(performance.now()%L)/L);
  ctx.globalCompositeOperation='source-in';ctx.drawImage(wOff,gx,gy,gw,gh);
  ctx.restore();
}
function welcomeLoop(){W.raf=0;if($('welcome').hidden)return;drawWelcome();if(!REDUCED)W.raf=requestAnimationFrame(welcomeLoop);}
function showMood(k){
  const prev=$('wcvPrev'),cur=$('wcv');
  if(W.state){ // cross-fade from the previous mood
    prev.width=cur.width;prev.height=cur.height;prev.getContext('2d').drawImage(cur,0,0);
    prev.style.transition='none';prev.style.opacity='1';prev.offsetWidth;prev.style.transition='';prev.style.opacity='0';
  }
  const p=presetData[W_MOODS[k]];W.k=k;
  W.state=Object.assign({},DEF,{bg:p.bg,layers:p.layers,blur:30,grain:8,motion:{on:true,loop:10,flow:80}});
  drawWelcome();
}
// From the editor (logo click) or on a visit with saved work, the main button
// continues that design; "New design" begins fresh.
function openWelcome(fromEditor=false){
  closePicker(true);closePops();hideMenu();
  const hasWork=fromEditor||!!SAVED;
  $('wNew').hidden=!hasWork;
  $('wGoLabel').textContent=hasWork?'Continue':'Start creating';
  const el=$('welcome');el.hidden=false;
  if(fromEditor){el.classList.add('entering');el.offsetWidth;el.classList.remove('entering');}
  W.k=0;W.state=null;showMood(0);welcomeLoop();
  if(!REDUCED)W.timer=setInterval(()=>showMood((W.k+1)%W_MOODS.length),4500);
}
function closeWelcome(){
  clearInterval(W.timer);
  const w=$('welcome');w.classList.add('leaving');
  setTimeout(()=>{w.hidden=true;w.classList.remove('leaving');cancelAnimationFrame(W.raf);W.raf=0;syncAnim();},550);
}
$('wGo').onclick=closeWelcome;
$('wNew').onclick=()=>{applyPreset(START);closeWelcome();};
$('btnHome').onclick=()=>openWelcome(true);
window.addEventListener('resize',()=>{if(!$('welcome').hidden)drawWelcome();});

/* ================= Init ================= */
hydrateIcons();
buildPresets();
renderAll();
fitFrame();
commit(true);
if(shouldWelcome())openWelcome();
</script>
</body>
